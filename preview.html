<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive QA · Bible Colors V2</title><style>body{margin:0;background:#dce4d8;font:14px system-ui;color:#244c40}header{padding:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}iframe{display:block;width:390px;height:844px;border:0;background:#faf8f1;margin:0 auto}button,select{padding:8px}output{display:block;text-align:center}</style><header><label>Site <select id="site"><option value="./?release=v2.7">Coloring V2</option><option value="https://crownofthornsworship.github.io/light-and-life-games/">Game hub</option><option value="https://crownofthornsworship.github.io/salt-and-light-web-studio/">Web Studio</option></select></label><label>Viewport <select id="size"><option value="390,844">390 × 844</option><option value="360,800">360 × 800</option><option value="412,915">412 × 915</option><option value="844,390">844 × 390 landscape</option></select></label><button id="pinch">Test synthetic pinch and drag</button></header><output id="result">Manual responsive test surface · synthetic events are not physical touch testing</output><iframe src="./?release=v2.7" title="Phone layout"></iframe><script>
const frame=document.querySelector('iframe');site.onchange=()=>{frame.src=site.value;};size.onchange=()=>{const [w,h]=size.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';};
pinch.onclick=()=>{const d=frame.contentDocument,v=d.querySelector('#viewport');if(!v){result.textContent='Open a coloring scene first.';return;}const b=v.getBoundingClientRect(),svg=d.querySelector('.color-art'),before=svg.style.transform,fills=[...d.querySelectorAll('[data-region]')].map(e=>e.getAttribute('fill')).join('|');const send=(type,id,x,y)=>v.dispatchEvent(new frame.contentWindow.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:b.left+x,clientY:b.top+y,bubbles:true,cancelable:true}));send('pointerdown',71,100,150);send('pointerdown',72,200,150);send('pointermove',71,50,150);send('pointermove',72,250,150);send('pointerup',71,50,150);send('pointerup',72,250,150);const enlarged=svg.style.transform;send('pointerdown',73,200,200);send('pointermove',73,130,120);send('pointerup',73,130,120);const moved=svg.style.transform,after=[...d.querySelectorAll('[data-region]')].map(e=>e.getAttribute('fill')).join('|');result.textContent=(before!==enlarged&&enlarged!==moved&&fills===after?'PASS':'FAIL')+' · synthetic two-pointer zoom, drag, no accidental fill · '+d.querySelector('#zoom-status').textContent;};
</script></html>
